# JCloud 인스턴스용 nginx 설정 예시
# 위치: /etc/nginx/sites-available/app  →  sites-enabled 에 심볼릭 링크
server {
    listen 80;
    server_name _;

    # npm run build 결과(dist/)를 이 경로에 복사한다
    root /var/www/app;
    index index.html;

    # Vue Router history 모드: 없는 경로는 index.html 로 넘겨 새로고침 404 를 막는다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 정적 파일은 오래 캐시한다
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
